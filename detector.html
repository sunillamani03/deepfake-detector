
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Deepfake Detector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Inter',sans-serif;
      min-height:100vh;
      background:rgb(158, 234, 241);
      position:relative;
      overflow-x:hidden;
    }
    body::before{
      content:'';
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      background:
        radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(168,85,247,0.15), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(14,165,233,0.1), transparent 50%);
      animation:pulse 8s ease-in-out infinite;
      z-index:0;
    }
    @keyframes pulse{
      0%, 100%{opacity:1}
      50%{opacity:0.7}
    }
    .orb{
      position:fixed;
      border-radius:50%;
      filter:blur(80px);
      opacity:0.3;
      z-index:0;
      animation:float 20s ease-in-out infinite;
    }
    .orb1{
      width:400px;height:400px;
      background:linear-gradient(135deg,#6366f1,#a855f7);
      top:-100px;left:-100px;
    }
    .orb2{
      width:300px;height:300px;
      background:linear-gradient(135deg,#0ea5e9,#06b6d4);
      bottom:-80px;right:-80px;
      animation-delay:5s;
    }
    @keyframes float{
      0%, 100%{transform:translate(0,0) scale(1)}
      33%{transform:translate(30px,-30px) scale(1.05)}
      66%{transform:translate(-20px,20px) scale(0.95)}
    }
    .container{
      position:relative;
      z-index:1;
      padding:30px 20px;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .glass-card{
      width:100%;
      max-width:1100px;
      background:rgba(61, 98, 118, 0.7);
      backdrop-filter:blur(20px);
      border:1px solid rgba(148,163,184,0.2);
      border-radius:24px;
      padding:32px;
      box-shadow:0 8px 32px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation:slideIn 0.6s ease-out;
    }
    @keyframes slideIn{
      from{opacity:0;transform:translateY(30px)}
      to{opacity:1;transform:translateY(0)}
    }
    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:24px;
      padding:16px 20px;
      background:rgba(28, 83, 79, 0.6);
      backdrop-filter:blur(10px);
      border-radius:16px;
      border:1px solid rgba(99,102,241,0.3);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:20px;
      font-weight:700;
      color:#fff;
    }
    .brand-icon{
      width:40px;height:40px;
      background:linear-gradient(135deg,#6366f1,#a855f7);
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
    }
    .logout{
      padding:10px 20px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#ef4444,#dc2626);
      color:#fff;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .logout:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 20px rgba(239,68,68,0.4);
    }
    h1{
      font-size:32px;
      font-weight:800;
      color:#fff;
      margin-bottom:8px;
    }
    .subtitle{
      font-size:15px;
      color:#94a3b8;
      margin-bottom:28px;
    }
    .types{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:12px;
      margin-bottom:24px;
    }
    .type-card{
      padding:16px;
      background:rgba(15,23,42,0.6);
      border:2px solid rgba(71,85,105,0.5);
      border-radius:16px;
      cursor:pointer;
      transition:all 0.3s;
      text-align:center;
    }
    .type-card:hover{
      border-color:rgba(99,102,241,0.6);
      transform:translateY(-4px);
    }
    .type-card.active{
      background:linear-gradient(135deg,rgba(99,102,241,0.3),rgba(168,85,247,0.3));
      border-color:#6366f1;
      box-shadow:0 0 20px rgba(99,102,241,0.4);
    }
    .type-icon{font-size:32px;margin-bottom:8px}
    .type-label{
      font-size:13px;
      font-weight:600;
      color:#e2e8f0;
    }
    .upload-zone{
      position:relative;
      padding:48px 24px;
      border:2px dashed rgba(99,102,241,0.5);
      border-radius:20px;
      background:rgba(15,23,42,0.4);
      text-align:center;
      cursor:pointer;
      transition:all 0.3s;
      margin-bottom:20px;
    }
    .upload-zone.drag{
      border-color:#6366f1;
      background:rgba(99,102,241,0.2);
      transform:scale(1.02);
    }
    .upload-icon{
      font-size:64px;
      margin-bottom:16px;
      animation:bounce 2s ease-in-out infinite;
    }
    @keyframes bounce{
      0%, 100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }
    .upload-text{
      font-size:18px;
      font-weight:600;
      color:#e2e8f0;
      margin-bottom:6px;
    }
    .upload-hint{
      font-size:13px;
      color:#94a3b8;
      margin-bottom:16px;
    }
    .upload-btn{
      padding:12px 28px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      color:#fff;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:all 0.3s;
    }
    .upload-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(99,102,241,0.5);
    }
    input[type=file]{display:none}
    .preview{
      display:none;
      border-radius:16px;
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(71,85,105,0.5);
      overflow:hidden;
      margin-bottom:20px;
      animation:fadeIn 0.4s;
    }
    @keyframes fadeIn{
      from{opacity:0}
      to{opacity:1}
    }
    .preview-header{
      padding:12px 16px;
      background:rgba(15,23,42,0.8);
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(71,85,105,0.3);
    }
    .preview-name{
      font-size:13px;
      color:#cbd5e1;
      font-weight:500;
    }
    .remove-btn{
      border:none;
      background:rgba(239,68,68,0.2);
      color:#fca5a5;
      width:28px;height:28px;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
      transition:all 0.2s;
    }
    .remove-btn:hover{
      background:rgba(239,68,68,0.4);
    }
    .preview-body{
      padding:20px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      max-height:300px;
    }
    .preview-body img,
    .preview-body video,
    .preview-body audio{
      max-width:100%;
      max-height:300px;
      border-radius:8px;
    }
    .actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }
    .status{
      font-size:13px;
      color:#94a3b8;
    }
    .analyze-btn{
      padding:14px 32px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#10b981,#059669);
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:all 0.3s;
      box-shadow:0 4px 16px rgba(16,185,129,0.3);
    }
    .analyze-btn:hover:not(:disabled){
      transform:translateY(-3px);
      box-shadow:0 8px 24px rgba(16,185,129,0.5);
    }
    .analyze-btn:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }
    @media(max-width:768px){
      .glass-card{padding:20px}
      h1{font-size:26px}
      .types{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="container">
    <div class="glass-card">
      <div class="header">
        <div class="brand">
          <div class="brand-icon">🔍</div>
          <span>AI Deepfake Detector</span>
        </div>
        <button class="logout" onclick="logout()">Logout</button>
      </div>

      <h1>Upload & Analyze</h1>
      <p class="subtitle">Select media type, upload your file, and get AI-powered deepfake analysis in seconds</p>

      <div class="types">
        <div class="type-card active" data-type="image">
          <div class="type-icon">🖼</div>
          <div class="type-label">Image</div>
        </div>
        <div class="type-card" data-type="video">
          <div class="type-icon">🎥</div>
          <div class="type-label">Video</div>
        </div>
        <div class="type-card" data-type="audio">
          <div class="type-icon">🎧</div>
          <div class="type-label">Audio</div>
        </div>
        <div class="type-card" data-type="pdf">
          <div class="type-icon">📄</div>
          <div class="type-label">PDF</div>
        </div>
      </div>

      <div class="upload-zone" id="dropZone">
        <div class="upload-icon">☁</div>
        <div class="upload-text">Drop your file here</div>
        <div class="upload-hint" id="hint">Supported: JPG, PNG, JPEG, GIF</div>
        <button class="upload-btn" onclick="fileInput.click()">Browse Files</button>
      </div>

      <div class="preview" id="preview">
        <div class="preview-header">
          <span class="preview-name" id="fileName">-</span>
          <button class="remove-btn" onclick="clearFile()">×</button>
        </div>
        <div class="preview-body" id="previewBody"></div>
      </div>

      <div class="actions">
        <div class="status" id="status">No file selected</div>
        <button class="analyze-btn" id="analyzeBtn" disabled onclick="analyze()">
          🚀 Analyze Now
        </button>
      </div>

      <input type="file" id="fileInput">
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const preview = document.getElementById('preview');
    const previewBody = document.getElementById('previewBody');
    const fileNameEl = document.getElementById('fileName');
    const statusEl = document.getElementById('status');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const hintEl = document.getElementById('hint');

    let currentType = 'image';
    let selectedFile = null;

    // Media type selection
    document.querySelectorAll('.type-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.type-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentType = card.dataset.type;
        updateHint();
        clearFile();
      });
    });

    function updateHint(){
      const hints = {
        image: 'Supported: JPG, PNG, JPEG, GIF',
        video: 'Supported: MP4, AVI, MOV, MKV',
        audio: 'Supported: MP3, WAV, M4A',
        pdf: 'Supported: PDF documents only'
      };
      hintEl.textContent = hints[currentType];
      const accepts = {
        image: 'image/*',
        video: 'video/*',
        audio: 'audio/*',
        pdf: 'application/pdf'
      };
      fileInput.accept = accepts[currentType];
    }
    updateHint();

    // File selection
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    // Drag & drop
    ['dragenter', 'dragover'].forEach(evt => {
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        dropZone.classList.add('drag');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        dropZone.classList.remove('drag');
      });
    });
    dropZone.addEventListener('drop', e => {
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file){
      selectedFile = file;
      fileNameEl.textContent = file.name;
      statusEl.textContent = '✅ Ready to analyze';
      analyzeBtn.disabled = false;

      previewBody.innerHTML = '';
      if (currentType === 'image') {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        previewBody.appendChild(img);
      } else if (currentType === 'video') {
        const v = document.createElement('video');
        v.controls = true;
        v.src = URL.createObjectURL(file);
        previewBody.appendChild(v);
      } else if (currentType === 'audio') {
        const a = document.createElement('audio');
        a.controls = true;
        a.src = URL.createObjectURL(file);
        previewBody.appendChild(a);
      } else {
        const span = document.createElement('span');
        span.style.color = '#e2e8f0';
        span.textContent = 'PDF selected. Preview not available.';
        previewBody.appendChild(span);
      }
      preview.style.display = 'block';
    }

    function clearFile(){
      selectedFile = null;
      fileInput.value = '';
      preview.style.display = 'none';
      previewBody.innerHTML = '';
      statusEl.textContent = 'No file selected';
      analyzeBtn.disabled = true;
    }

    async function analyze() {
      if (!selectedFile) {
        alert("Please select a file first");
        return;
      }

      const formData = new FormData();
      formData.append("file", selectedFile);
      formData.append("media_type", currentType); // optional hint for backend

      statusEl.textContent = "Analyzing...";
      analyzeBtn.disabled = true;

      const start = performance.now();

      try {
        // IMPORTANT: this path must match your Flask route
        const res = await fetch('http://127.0.0.1:5000/api/analyze',{
          method: "POST",
          body: formData
        });

        if (!res.ok) {
          const text = await res.text();
          console.error("Server error:", res.status, text);
          alert("Server error: " + res.status);
          statusEl.textContent = "Server error";
          analyzeBtn.disabled = false;
          return;
        }

        const data = await res.json();
        const elapsedSeconds = ((performance.now() - start) / 1000).toFixed(2);

        const payload = {
          ...data,
          clientFileName: selectedFile.name,
          clientDuration: elapsedSeconds,
          clientType: currentType
        };
        localStorage.setItem("deepfakeResult", JSON.stringify(payload));

        statusEl.textContent = "Analysis complete. Opening result...";
        window.location.href = "result.html";

      } catch (err) {
        console.error("Analyze error:", err);
        alert("Analyze error: " + err.message);
        statusEl.textContent = "Analyze error";
        analyzeBtn.disabled = false;
      }
    }

    function logout(){
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
