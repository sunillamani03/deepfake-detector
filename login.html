<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Deepfake Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-container {
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
        }

        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">🔍</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to access AI Deepfake Detector</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required placeholder="Enter your password">
            </div>
  <button type="submit" class="btn-submit" id="loginBtn">Log In</button>
  <div id="loginMessage"></div>

        </form>

        <div class="login-link">
            <a href="forgot.html">Forgot password?</a>
        </div>
        
        <div class="login-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

<script>
  console.log("LOGIN SCRIPT LOADED");  // <-- add this line

  const formEl = document.getElementById("loginForm");
console.log("FORM ELEMENT:", formEl);

formEl.addEventListener("submit", (e) => {
  e.preventDefault();
  console.log("LOGIN FORM SUBMITTED"); });

  const API_URL = "http://localhost:5000";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const emailEl = document.getElementById("loginEmail");
    const passwordEl = document.getElementById("loginPassword");
    const msg = document.getElementById("loginMessage");

    if (!emailEl || !passwordEl) {
      console.error("Login inputs not found");
      msg.textContent = "Login form inputs not found. Check IDs.";
      return;
    }

    const email = emailEl.value.trim();
    const password = passwordEl.value.trim();

    if (!email || !password) {
      msg.textContent = "Please enter both email and password";
      msg.className = "message error";
      return;
    }

    try {
      const resp = await fetch(`${API_URL}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await resp.json();

      if (resp.ok && data.success) {
        console.log("LOGIN SUCCESS - Redirecting to detector.html", data);
        msg.textContent = data.message || "Login successful! Redirecting...";
        msg.className = "message success";
        setTimeout(() => {
          window.location.href = "detector.html";
        }, 500);
      } else {
        console.log("LOGIN FAILED", resp.status, data);
        msg.textContent = data.error || "Invalid email or password";
        msg.className = "message error";
      }
    } catch (err) {
      console.error("Login error:", err);
      msg.textContent = "Cannot reach server. Make sure Flask is running.";
      msg.className = "message error";
    }
  });
</script>
</body>
</html>
